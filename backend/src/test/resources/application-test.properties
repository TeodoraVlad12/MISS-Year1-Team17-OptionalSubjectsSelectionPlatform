# Test Configuration for Spring Boot
# This profile is activated for all tests

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable SQL script initialization for tests
spring.sql.init.mode=never

# JWT Configuration for tests
jwt.secret=TestSecretKeyForJWTTokenGenerationMustBeLongEnough123456789
jwt.expiration=3600000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.ro.uaic.ossp=DEBUG

# Disable unnecessary features for faster tests
spring.main.lazy-initialization=true

